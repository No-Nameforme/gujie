name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add COOP/COEP headers via Service Worker
        run: |
          # Create service worker that injects COOP/COEP headers
          cat > sw.js << 'SWEOF'
          self.addEventListener('install', event => {
            self.skipWaiting();
          });
          self.addEventListener('activate', event => {
            event.waitUntil(clients.claim());
          });
          self.addEventListener('fetch', event => {
            event.respondWith(
              fetch(event.request).then(response => {
                const newHeaders = new Headers(response.headers);
                newHeaders.set('Cross-Origin-Embedder-Policy', 'require-corp');
                newHeaders.set('Cross-Origin-Opener-Policy', 'same-origin');
                return new Response(response.body, {
                  status: response.status,
                  statusText: response.statusText,
                  headers: newHeaders
                });
              })
            );
          });
          SWEOF

          # Inject service worker registration + auto-reload into index.html
          # Key: on first load, register SW then reload so headers take effect
          sed -i 's|</head>|<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").then(function(reg){if(!navigator.serviceWorker.controller){navigator.serviceWorker.addEventListener("controllerchange",function(){window.location.reload()})}})}</script></head>|' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
