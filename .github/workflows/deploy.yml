name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add COOP/COEP headers via Service Worker
        run: |
          cat > sw.js << 'SWEOF'
          self.addEventListener('fetch', event => {
            event.respondWith(
              fetch(event.request).then(response => {
                if (event.request.destination === 'document' || event.request.url.endsWith('.html') || event.request.url.endsWith('/')) {
                  const newHeaders = new Headers(response.headers);
                  newHeaders.set('Cross-Origin-Embedder-Policy', 'require-corp');
                  newHeaders.set('Cross-Origin-Opener-Policy', 'same-origin');
                  return new Response(response.body, {
                    status: response.status,
                    statusText: response.statusText,
                    headers: newHeaders
                  });
                }
                return response;
              })
            );
          });
          SWEOF

          sed -i 's|</head>|<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }</script></head>|' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
