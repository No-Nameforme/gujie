name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add COOP/COEP headers via Service Worker
        run: |
          # Create service worker with cache-busting
          cat > sw.js << 'SWEOF'
          const CACHE_NAME = 'gujie-v7.5.2';
          
          self.addEventListener('install', event => {
            self.skipWaiting();
          });
          
          self.addEventListener('activate', event => {
            event.waitUntil(
              caches.keys().then(names => {
                return Promise.all(names.filter(n => n !== CACHE_NAME).map(n => caches.delete(n)));
              }).then(() => clients.claim())
            );
          });
          
          self.addEventListener('fetch', event => {
            // Never cache - always fetch fresh, then add headers
            event.respondWith(
              fetch(event.request, { cache: 'no-store' }).then(response => {
                const newHeaders = new Headers(response.headers);
                newHeaders.set('Cross-Origin-Embedder-Policy', 'require-corp');
                newHeaders.set('Cross-Origin-Opener-Policy', 'same-origin');
                newHeaders.set('Cache-Control', 'no-cache');
                return new Response(response.body, {
                  status: response.status,
                  statusText: response.statusText,
                  headers: newHeaders
                });
              })
            );
          });
          SWEOF

          # Inject service worker registration with cache busting into index.html
          sed -i 's|</head>|<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js?v='$(date +%s)'").then(function(reg){if(!navigator.serviceWorker.controller){navigator.serviceWorker.addEventListener("controllerchange",function(){window.location.reload()})}else{reg.update()}})}</script></head>|' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
