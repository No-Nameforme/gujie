name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup COOP/COEP Service Worker
        run: |
          cat > sw.js << 'SWEOF'
          // COOP/COEP Service Worker v2
          // Only intercepts navigation requests to add cross-origin isolation headers.
          // All subresource requests pass through unmodified to avoid breaking binary streams.
          const SW_VERSION = 2;
          
          self.addEventListener('install', event => {
            self.skipWaiting();
          });
          
          self.addEventListener('activate', event => {
            // Clean up old caches and take control immediately
            event.waitUntil(
              caches.keys().then(names => 
                Promise.all(names.map(n => caches.delete(n)))
              ).then(() => clients.claim())
            );
          });
          
          self.addEventListener('fetch', event => {
            // Only intercept navigation requests (the HTML page)
            // This adds COOP/COEP for SharedArrayBuffer without breaking .wasm/.pck loading
            if (event.request.mode === 'navigate') {
              event.respondWith(
                fetch(event.request).then(response => {
                  const newHeaders = new Headers(response.headers);
                  newHeaders.set('Cross-Origin-Embedder-Policy', 'require-corp');
                  newHeaders.set('Cross-Origin-Opener-Policy', 'same-origin');
                  return new Response(response.body, {
                    status: response.status,
                    statusText: response.statusText,
                    headers: newHeaders
                  });
                })
              );
            }
            // All other requests (wasm, pck, js) pass through normally
          });
          SWEOF

          # Inject SW registration + force update logic into index.html
          sed -i 's|</head>|<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").then(function(reg){reg.update();if(!navigator.serviceWorker.controller){navigator.serviceWorker.addEventListener("controllerchange",function(){window.location.reload()})}})}</script></head>|' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
